AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-off bootstrap: GitHub Actions OIDC provider and a deploy role for the
  tsms-bot stack, so CI needs no long-lived AWS keys.
  Deploy once: aws cloudformation deploy --region eu-west-2 --stack-name tsms-bot-github-oidc
    --template-file infra/github-oidc.yaml --capabilities CAPABILITY_NAMED_IAM
    --parameter-overrides GitHubRepo=<owner>/<repo>

Parameters:
  GitHubRepo:
    Type: String
    Description: owner/repo allowed to assume the role (e.g. example-owner/example-repo)
  StackName:
    Type: String
    Default: tsms-bot
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if token.actions.githubusercontent.com already exists in this account.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]  # ignored by AWS for GitHub since 2023, still required syntactically

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StackName}-github-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Environment jobs use environment subjects, not branch subjects.
                # Restrict allowed branches in both GitHub environments.
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepo}:environment:staging"
                  - !Sub "repo:${GitHubRepo}:environment:prod"
      Policies:
        - PolicyName: deploy-tsms-bot
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}-staging/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*"
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:CreateBucket, s3:PutObject, s3:GetObject, s3:ListBucket, s3:GetBucketLocation, s3:PutBucketPublicAccessBlock, s3:PutLifecycleConfiguration]
                Resource:
                  - !Sub "arn:aws:s3:::${StackName}-artifacts-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:aws:s3:::${StackName}-artifacts-${AWS::AccountId}-${AWS::Region}/*"
              - Sid: StackResources
                Effect: Allow
                Action:
                  - lambda:*
                  - logs:*
                  - events:*
                  - cloudwatch:*
                  - sns:*
                  - dynamodb:Describe*
                  - dynamodb:List*
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                Resource: "*"
              - Sid: FunctionRole
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${StackName}-role"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${StackName}-staging-role"
              - Sid: Identity
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"

Outputs:
  DeployRoleArn:
    Description: Store as the GitHub repository secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
